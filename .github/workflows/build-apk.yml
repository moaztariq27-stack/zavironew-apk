name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_VER_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ "${JAVA_MAJOR}" = "1" ]; then
            JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -n 's/.*version "1\.\([0-9][0-9]*\).*/\1/p' | head -n 1)
          fi
          if [ -z "${JAVA_MAJOR}" ]; then
            echo "Error: Unable to detect active Java major version." >&2
            exit 1
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java version (${JAVA_MAJOR}) is lower than 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          for GRADLE_HOME_DIR in "${HOME}/.gradle" "${GRADLE_USER_HOME:-${HOME}/.gradle}"; do
            mkdir -p "${GRADLE_HOME_DIR}"
            if ! grep -q "org.gradle.configuration-cache=false" "${GRADLE_HOME_DIR}/gradle.properties" 2>/dev/null; then
              echo "org.gradle.configuration-cache=false" >> "${GRADLE_HOME_DIR}/gradle.properties"
            fi
          done
          for SDK_DIR in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk"; do
            if [ -n "${SDK_DIR}" ] && [ -d "${SDK_DIR}" ]; then
              mkdir -p "${SDK_DIR}/licenses"
              printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${SDK_DIR}/licenses/android-sdk-license"
              printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_DIR}/licenses/android-sdk-preview-license"
              printf "\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${SDK_DIR}/licenses/android-sdk-arm-dbt-license"
              printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "${SDK_DIR}/licenses/android-googletv-license"
              printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "${SDK_DIR}/licenses/google-gdk-license"
              printf "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "${SDK_DIR}/licenses/mips-android-sysimage-license"
              SDKMANAGER_BIN=""
              if [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMANAGER_BIN="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
              elif command -v sdkmanager >/dev/null 2>&1; then
                SDKMANAGER_BIN="$(command -v sdkmanager)"
              fi
              if [ -n "${SDKMANAGER_BIN}" ]; then
                yes | "${SDKMANAGER_BIN}" --sdk_root="${SDK_DIR}" --licenses >/dev/null 2>&1 || true
                if [ ! -d "${SDK_DIR}/platforms/android-36.1" ]; then
                  "${SDKMANAGER_BIN}" --sdk_root="${SDK_DIR}" "platforms;android-36.1" || true
                fi
              fi
            fi
          done
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            base64 -d << 'EOF' > app/google-services.json
          
          EOF
          fi
          if [ -f "./debug.keystore" ] && [ -s "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          elif [ -f "./debug.keystore.base64" ] && [ -s "./debug.keystore.base64" ]; then
            tr -d '\r\n ' < ./debug.keystore.base64 | base64 -d > ./debug.keystore
            echo "Restored ./debug.keystore from ./debug.keystore.base64."
          else
            base64 -d << 'KS_EOF' > ./debug.keystore
          
          KS_EOF
            echo "Restored ./debug.keystore from embedded base64."
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created." >&2
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Align and sign APK with v1, v2, and v3 schemes
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR=""
          for SDK_DIR in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk" "/opt/android/sdk"; do
            if [ -n "${SDK_DIR}" ] && [ -d "${SDK_DIR}/build-tools" ]; then
              LATEST_BT=$(ls -1d "${SDK_DIR}/build-tools/"* 2>/dev/null | sort -V | tail -n 1 || true)
              if [ -n "${LATEST_BT}" ]; then
                BUILD_TOOLS_DIR="${LATEST_BT}"
                break
              fi
            fi
          done
          if [ -n "${BUILD_TOOLS_DIR}" ] && [ -x "${BUILD_TOOLS_DIR}/zipalign" ] && [ -x "${BUILD_TOOLS_DIR}/apksigner" ]; then
            "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "${EXPECTED_APK}" "${EXPECTED_APK}.aligned"
            mv -f "${EXPECTED_APK}.aligned" "${EXPECTED_APK}"
            "${BUILD_TOOLS_DIR}/apksigner" sign \
              --ks ./debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --min-sdk-version 21 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "${EXPECTED_APK}"
            "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "${EXPECTED_APK}"
          fi

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK not found at ${EXPECTED_APK}" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk:" >&2
              find app/build/outputs/apk -type f -name "*.apk" -print >&2 || true
            fi
            exit 1
          fi
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is not a regular file." >&2
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is empty." >&2
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "Error: ${EXPECTED_APK} does not have the .apk extension." >&2
              exit 1
              ;;
          esac
          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi
          echo "Verified APK at ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")
          PREPARED_APK="${RELEASE_TMP_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${PREPARED_APK}"
          if [ ! -f "${PREPARED_APK}" ] || [ ! -s "${PREPARED_APK}" ]; then
            echo "Error: Failed to prepare non-empty release asset at ${PREPARED_APK}" >&2
            exit 1
          fi
          echo "asset_path=${PREPARED_APK}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "Error: GitHub CLI (gh) is not available." >&2
            exit 1
          fi
          gh --version
          if [ -z "${PREPARED_ASSET_PATH}" ] || [ ! -f "${PREPARED_ASSET_PATH}" ]; then
            echo "Error: Prepared APK asset does not exist." >&2
            exit 1
          fi
          if [ ! -s "${PREPARED_ASSET_PATH}" ]; then
            echo "Error: Prepared APK asset is empty." >&2
            exit 1
          fi
          ASSET_BASENAME=$(basename "${PREPARED_ASSET_PATH}")
          if [ "${ASSET_BASENAME}" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be app-debug.apk, got ${ASSET_BASENAME}" >&2
            exit 1
          fi
          case "${ASSET_BASENAME}" in
            *.apk) ;;
            *)
              echo "Error: Release asset does not end in .apk" >&2
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="This is an automatically generated debug APK.

          - The APK was built by GitHub Actions.
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - APK is intended for testing.
          - APK is not a Play Store production release.
          - APK is signed only with a temporary debug keystore."

          gh release create "${RELEASE_TAG}" "${PREPARED_ASSET_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            RELEASE_PAGE_URL=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url -q .url)
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_URL}"
            echo "Note: The normal Actions artifact app-debug-apk remains available as a backup."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** The normal Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "WARNING: GitHub Release publishing failed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The APK build succeeded and the Actions artifact named app-debug-apk remains available."
            fi
            {
              echo "### WARNING: GitHub Release Publishing Failed"
              echo "The APK build succeeded and the Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
